name: VoiceNotes
options:
  bundleIdPrefix: com.ntna
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  EasyBLE:
    path: ../../EasyBLE
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  VoiceNotes:
    type: application
    platform: iOS
    sources:
      - path: VoiceNotes
    dependencies:
      - package: EasyBLE
        product: EasyBLE
    info:
      path: VoiceNotes/Info.plist
      properties:
        CFBundleDisplayName: VoiceNotes
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: VoiceNotes connects to your VoiceNote recorder to receive recordings and sync moods.
        NSPhotoLibraryUsageDescription: Pick images to use as custom mood icons on the device.
        NSAccessorySetupKitSupports:
          - Bluetooth
        NSAccessorySetupBluetoothServices:
          - 6E400001-B5A3-F393-E0A9-E50E24DCCA9E
        UIBackgroundModes:
          - bluetooth-central
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.ntna.VoiceNotes.transcription.refresh
          - com.ntna.VoiceNotes.transcription.process
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ntna.VoiceNotes
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
